schema: spec-driven
context: |
  Project: Rogue's Dungeon, a single-player 2D medieval endless dungeon roguelite.
  This is a new GitHub repository created from the current main branch of
  SamuelAsherRivello/github-repository-template. The app folder will be
  rogues-dungeon/ and the Vite/npm project root remains the repository root.
  Use React 19, Vite 8, and Babylon Lite 1.32.0 with WebGPU only. Do not add a
  fallback renderer. All 2D rendering follows the template's Pixel Perfect
  policy; the world uses 32x32 Tiled pixel art, nearest filtering, and native
  render scale by default. User-facing Zoom levels are Half (0.5x), Native
  (1.0x), and Double (2.0x), implemented through the template's render
  resolution facility. Native is the default.
  The viewport is fixed landscape 16:9; remove orientation selection and keep
  the template's title, links, settings, and version corner roles. Desktop
  keyboard supports 8-way WASD and arrow-key movement, including diagonals via
  paired directions. Mobile has a visible 8-way virtual controller. One legal
  grid step or bump interaction advances exactly one turn; enemies act once
  only after the player advances time. Diagonal movement cannot cut blocked
  corners. Bumping handles attacks, stairs, pickups, and object interactions.
  The dungeon is procedurally generated and endlessly descendable. Stairs are
  reached by stepping onto them; deeper floors add stronger enemy types and
  stats. The player begins each run with empty gear and a nearby stick. Five
  equipment slots are head, body, legs, left arm, and right arm. Both equipped
  hands attack in one bump action. Gear comes from enemy drops and chests; if a
  slot is occupied, the player can swap or leave the found item.
  Six persistent character stats are Vitality, Strength, Defense, Stamina,
  Luck, and Recovery. Enemies and discoveries grant XP; every level offers
  three stat choices. Stats, level, and partial XP persist after death; the
  current floor and gear reset into a new procedural run. Stamina powers a
  defensive Brace action. Recovery heals on floor descent.
  Exactly three independent save slots use localStorage. Each slot autosaves
  the full active run after each turn and resumes it after reload. Do not add
  accounts, online saves, multiplayer, a final boss, or orientation switching.
  Keep core game rules separate from React UI and Babylon Lite rendering where
  practical. Commands are run from the repository root. Preserve template
  release/version conventions and do not create a pull request unless asked.
  The supplied Dungeons-and-Pixels-v1.4 pack is the source for the hero,
  enemies, props, items, and Tiled tilesets. Record its asset provenance.
  Shared game skills were read from ai-skills-library master at
  befef8e689341adf7b34ae89b9a665bc26ac1be8. The template's checked-in
  OpenSpec workflows are generated by 1.14.0; use that compatible CLI for
  project OpenSpec operations and preserve the generated files.
  Playwright is available for browser-owned behavior but is optional for each
  change. It serves the active OpenSpec skill: explore and proposal decide
  whether browser evidence is needed without launching it; apply runs one
  focused check after the related implementation group; finalization runs the
  full applicable suite and reports unavailable required browser capabilities.
  Browser sessions for Rogue's Dungeon include ?mute=1. Keep pure logic in the
  focused Node tests and do not change generated OpenSpec skills.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
    - For browser-visible behavior, record whether Playwright adds useful evidence; do not run it during proposal.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
    - When Playwright is selected, bound apply to one focused post-group check and reserve wider coverage for finalization.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.
    - Add Playwright tasks only for browser-visible behavior, place one focused run after its related implementation group, and state full-suite finalization coverage when applicable.

